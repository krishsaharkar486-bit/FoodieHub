{% extends 'base.html' %}{% block title %}My profile | FoodieHub{% endblock %}{% block content %}<div class="container narrow py-5"><div class="form-panel"><h1>My profile</h1><form method="post">{% csrf_token %}<label class="form-label">First name</label><input class="form-control mb-3" name="first_name" value="{{ user.first_name }}" required><label class="form-label">Last name</label><input class="form-control mb-3" name="last_name" value="{{ user.last_name }}"><label class="form-label">Email</label><input type="email" class="form-control mb-3" name="email" value="{{ user.email }}" required><button class="btn btn-food">Save changes</button></form></div></div>{% endblock %}

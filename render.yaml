databases:
  - name: foodiehub-db
    databaseName: foodiehub
    user: foodiehub
    plan: free

services:
  - type: web
    name: foodiehub
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: foodiehub-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.13.11"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"